<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon1.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zidni Nurfauzi - Frontend Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <div id="welcome-bootstrap" aria-hidden="true">
    <div class="wb-bg"></div>
    <div class="wb-orb wb-orb--a"></div>
    <div class="wb-orb wb-orb--b"></div>
    <div class="wb-orb wb-orb--c"></div>
    <div class="wb-icons">
      <span class="wb-icon">&#60;/&#62;</span>
      <span class="wb-icon">&#128100;</span>
      <span class="wb-icon">&#9737;</span>
    </div>
    <h1 class="wb-heading">
      <span class="wb-word">Welcome To My</span>
      <span class="wb-word wb-word--grad">Portfolio</span>
      <span class="wb-word wb-word--grad">Website</span>
    </h1>
  </div>
  <style>
    #welcome-bootstrap {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      background: #030014;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      animation: wbFadeOut 0.35s ease 0.05s forwards;
    }

    #welcome-bootstrap.wb-hide {
      display: none;
    }

    .wb-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.35), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.35), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.2), transparent 60%);
      filter: blur(30px);
    }

    .wb-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.5;
      animation: wbFloat 6s ease-in-out infinite;
    }

    .wb-orb--a {
      width: 300px;
      height: 300px;
      background: #6366f1;
      top: -50px;
      left: -50px;
    }

    .wb-orb--b {
      width: 250px;
      height: 250px;
      background: #a855f7;
      bottom: -50px;
      right: -50px;
      animation-delay: -2s;
    }

    .wb-orb--c {
      width: 200px;
      height: 200px;
      background: #2563eb;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -4s;
    }

    @keyframes wbFloat {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(20px, -20px) scale(1.1);
      }
    }

    .wb-orb--c {
      animation-name: wbFloatCenter;
    }

    @keyframes wbFloatCenter {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        transform: translate(-50%, -50%) scale(1.15);
      }
    }

    .wb-icons {
      display: flex;
      gap: 1rem;
      position: relative;
      z-index: 2;
    }

    .wb-icon {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      color: #fff;
      font-size: 1.5rem;
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.14) inset,
        0 4px 18px rgba(139, 92, 246, 0.5);
    }

    .wb-heading {
      position: relative;
      z-index: 2;
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      letter-spacing: 0.01em;
      margin: 0;
    }

    .wb-word {
      display: block;
    }

    .wb-word--grad {
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #5008cb 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    @keyframes wbFadeOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>
  <script>
    // hide fallback as soon as React mounts the real loader (or fails)
    (function () {
      var n = 0;
      var tryHide = function () {
        var el = document.getElementById('welcome-bootstrap');
        if (!el) return;
        if (document.getElementById('root').firstChild || n > 80) {
          el.classList.add('wb-hide');
          return;
        }
        n++;
        requestAnimationFrame(tryHide);
      };
      requestAnimationFrame(tryHide);
      window.addEventListener('load', tryHide);
      setTimeout(tryHide, 6000);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
